<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>PVZ 远程 · 入口</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#101418; color:#e8ecef;
    font-family:-apple-system,"PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .box { width:100%; max-width:340px; text-align:center; }
  .logo { font-size:42px; margin-bottom:16px; line-height:1; }
  h1 { font-size:19px; font-weight:600; margin-bottom:9px; }
  h1.err { color:#ef8f8f; }
  p { font-size:14px; color:#8b98a5; line-height:1.7; }
  .spin {
    width:34px; height:34px; margin:24px auto;
    border:3px solid rgba(255,255,255,.14);
    border-top-color:#5aa9e6; border-radius:50%;
    animation:sp .85s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg); } }
  input {
    width:100%; padding:13px 14px; margin-top:18px; font-size:16px;
    background:#1b2128; border:1px solid #2c353f; border-radius:10px;
    color:#e8ecef; font-family:inherit; text-align:center;
    -webkit-user-select:text; user-select:text;
  }
  input:focus { outline:none; border-color:#5aa9e6; }
  button {
    width:100%; padding:13px; margin-top:12px; font-size:16px;
    border:0; border-radius:10px; background:#2f6fa8; color:#fff;
    font-family:inherit; font-weight:500;
  }
  button:active { opacity:.8; }
  a.btn2 {
    display:block; width:100%; padding:12px; margin-top:12px; font-size:15px;
    border:1px solid #35506b; border-radius:10px; background:transparent;
    color:#8fc0e8; text-decoration:none; font-weight:500;
  }
  a.btn2:active { background:rgba(90,169,230,.12); }
  .hint { font-size:12px; color:#687585; margin-top:18px; line-height:1.65; word-break:break-all; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">&#127803;</div>
  <h1 id="title">正在找电脑…</h1>
  <p id="msg">请稍候</p>
  <div class="spin" id="spin"></div>

  <div id="auth" class="hidden">
    <input id="key" type="text" placeholder="输入访问码" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="ok">连接</button>
    <div class="hint">只需输入一次，之后自动记住</div>
  </div>

  <button id="retry" class="hidden">重试</button>
  <button id="force" class="hidden">仍然尝试打开</button>
  <a id="lanbtn" class="btn2 hidden">在家？点这里直连（更快）</a>
  <div class="hint" id="hint"></div>
</div>

<script>
(function () {
  "use strict";

  var OWNER = "Oscar321-oss";
  var REPO  = "pvz-remote";
  var FILE  = "current.json";
  var API   = "https://api.github.com/repos/" + OWNER + "/" + REPO +
              "/contents/" + FILE;

  var title = document.getElementById("title");
  var msg   = document.getElementById("msg");
  var spin  = document.getElementById("spin");
  var auth  = document.getElementById("auth");
  var keyIn = document.getElementById("key");
  var okBtn = document.getElementById("ok");
  var retry = document.getElementById("retry");
  var force = document.getElementById("force");
  var lanBtn= document.getElementById("lanbtn");
  var hint  = document.getElementById("hint");

  function getToken() {
    try { return localStorage.getItem("pvz_k") || ""; } catch (e) { return ""; }
  }
  function setToken(v) {
    try { localStorage.setItem("pvz_k", v); } catch (e) {}
  }
  function withToken(u) {
    var k = getToken();
    if (!k) { return u; }
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "k=" + encodeURIComponent(k);
  }

  // 「在家直连」按钮。
  // 为什么要有它：和电脑在同一个 Wi-Fi 时走局域网快得多（几毫秒 vs 几百毫秒），
  // 但页面本身是 https 的，用脚本去「探测」http 的局域网地址可能被浏览器的
  // 混合内容策略拦掉。而**整页跳转不受该策略限制**，所以做成一个用户点一下的
  // 按钮 —— 一定有效，且在家的收益立刻拿到；在外面不点它就行。
  var lanUrl = null;
  function setLan(lan) { lanUrl = lan || null; refreshLan(); }
  function refreshLan() {
    // 知道局域网地址、且已经存过访问码，才亮出这个按钮
    if (lanUrl && getToken()) {
      lanBtn.href = withToken(lanUrl);
      lanBtn.classList.remove("hidden");
    } else {
      lanBtn.classList.add("hidden");
    }
  }

  function show(t, m, mode) {
    title.textContent = t;
    msg.textContent = m || "";
    title.className = (mode === "err") ? "err" : "";
    spin.classList.toggle("hidden", mode !== "load");
    retry.classList.toggle("hidden", mode !== "err");
    force.classList.add("hidden");
    auth.classList.add("hidden");
  }

  function go(target) {
    var u = target;
    var k = getToken();
    if (k) {
      u += (u.indexOf("?") >= 0 ? "&" : "?") + "k=" + encodeURIComponent(k);
      show("正在连接电脑…", "", "load");
    } else {
      spin.classList.add("hidden");
      title.textContent = "需要访问码";
      msg.textContent = "第一次使用，请填入之前保存的访问码";
      auth.classList.remove("hidden");
      keyIn.focus();
      okBtn.onclick = function () {
        var v = keyIn.value.trim();
        if (!v) { keyIn.focus(); return; }
        setToken(v);
        refreshLan();
        go(target);
      };
      return;
    }

    var settled = false;
    function pass() { if (settled) { return; } settled = true; location.replace(u); }
    function fail() {
      if (settled) { return; }
      settled = true;
      show("电脑没有响应", "可能没开机，或者串流服务没启动", "err");
      hint.textContent = "如果确定电脑开着，点下面直接试";
      force.classList.remove("hidden");
      force.onclick = function () { location.replace(u); };
    }

    var img = new Image();
    img.onload = pass;
    img.onerror = fail;
    img.src = target + "/pixel.png?t=" + Date.now();
    setTimeout(function () { if (!settled) { settled = true; location.replace(u); } }, 4500);
  }

  // 快速探一下某个地址通不通（用于决定走局域网还是走公网）。
  // 超时给得很短：设备浏览器本来就慢，不能在这里多耗时间。
  function probeQuick(target, ms, cb) {
    var done = false;
    function fin(ok) { if (done) { return; } done = true; cb(ok); }
    var img = new Image();
    img.onload = function () { fin(true); };
    img.onerror = function () { fin(false); };
    img.src = target + "/pixel.png?t=" + Date.now();
    setTimeout(function () { fin(false); }, ms);
  }

  function decode(b64) {
    try {
      var s = atob(String(b64).replace(/[\r\n]/g, ""));
      return JSON.parse(decodeURIComponent(escape(s)));
    } catch (e) { return null; }
  }

  function attempt(n) {
    show("正在找电脑…", "第 " + n + " 次尝试", "load");
    fetch(API + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (j) {
        var data = decode(j.content || "");
        if (!data || !data.url) throw new Error("地址文件为空");
        var stamp = data.updated ? "电脑更新于 " + data.updated : "";
        setLan(data.lan);          // 记下局域网地址，亮出「在家直连」按钮

        // 和电脑在同一个 Wi-Fi 时，直连局域网比绕公网隧道快得多
        //（实测隧道 0.3~0.5 秒，局域网几毫秒）。先花不到 1 秒试一下，
        // 通了就走快通道；不通（或浏览器禁止探测）就照旧走公网，行为不退化。
        if (data.lan) {
          hint.textContent = "正在试局域网直连…";
          probeQuick(data.lan, 900, function (ok) {
            hint.textContent = stamp + (ok ? " · 局域网直连（快）" : " · 走公网");
            go(ok ? data.lan : data.url);
          });
          return;
        }
        hint.textContent = stamp;
        go(data.url);
      })
      .catch(function (e) {
        if (n < 3) { setTimeout(function () { attempt(n + 1); }, 1500); return; }
        show("找不到电脑", "电脑可能还没开机，或者串流服务没启动", "err");
        hint.textContent = String((e && e.message) || e);
      });
  }

  retry.onclick = function () { attempt(1); };

  (function readHash() {
    var m = /[#&]k=([^&]+)/.exec(location.hash || "");
    if (m) setToken(decodeURIComponent(m[1]));
  })();

  (function readQuery() {
    var m = /[?&]k=([^&]+)/.exec(location.search || "");
    if (m) setToken(decodeURIComponent(m[1]));
  })();

  attempt(1);
})();
</script>
</body>
</html>
